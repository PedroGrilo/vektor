name: build-windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      # package.json, Cargo.toml and tauri.conf.json must agree (and match the tag on a release).
      - name: Check versions
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            bun scripts/release-manifest.mjs check "$GITHUB_REF_NAME"
          else
            bun scripts/release-manifest.mjs check
          fi
      - run: bash scripts/fetch-npi.sh
        shell: bash
      - run: bun run lint
      - run: cargo test --lib
        working-directory: src-tauri
      # The installer is signed with the updater key so installed copies accept it.
      - run: bunx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: vektor-setup
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
      # `latest.json` is what the in-app updater fetches from the latest release.
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun scripts/release-manifest.mjs write "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" \
            src-tauri/target/release/bundle/nsis RELEASE_NOTES.md latest.json
          gh release create "$GITHUB_REF_NAME" src-tauri/target/release/bundle/nsis/*.exe latest.json \
            --title "Vektor $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
