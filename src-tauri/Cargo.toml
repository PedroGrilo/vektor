[package]
name = "vektor"
version = "0.1.0"
description = "Vektor — otimizador de PC e CS2"
authors = ["Link Consulting"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "vektor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.4" }
thiserror = "2.0.21"
sysinfo = "0.38.4"
libloading = "0.9.0"
tauri-plugin-opener = "2.7.2"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Services"] }
windows-service = "0.8.1"
winreg = "0.56.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
